<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Draw & Guess 🎨</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="lobby-bg">
  <div class="lobby-card">
    <div class="logo">🎨</div>
    <h1>Draw &amp; Guess</h1>
    <p class="tagline">One draws. Everyone guesses. First to type it wins!</p>

    <div class="form-group">
      <label for="name">Your name</label>
      <input id="name" type="text" placeholder="e.g. Alex" maxlength="20" autocomplete="off" />
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="create">Create Room</button>
      <button class="tab" data-tab="join">Join Room</button>
    </div>

    <div id="tab-create" class="tab-content">
      <button id="btn-create" class="btn btn-primary btn-lg">Create a new room →</button>
    </div>

    <div id="tab-join" class="tab-content hidden">
      <div class="form-group">
        <label for="code">Room code</label>
        <input id="code" type="text" placeholder="e.g. AB3K7Z" maxlength="6"
               autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em;" />
      </div>
      <button id="btn-join" class="btn btn-primary btn-lg">Join room →</button>
    </div>

    <div id="error-msg" class="error-box hidden"></div>

    <footer>
      No login • No install • Works on any phone or laptop
    </footer>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        tab.classList.add('active');
        document.getElementById('tab-' + tab.dataset.tab).classList.remove('hidden');
      });
    });

    // Generate a random code for "Create"
    function randomCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      return Array.from({ length: 6 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function getValidName() {
      const n = document.getElementById('name').value.trim();
      if (!n) { showError('Please enter your name first!'); return null; }
      return n;
    }

    document.getElementById('btn-create').addEventListener('click', () => {
      const name = getValidName();
      if (!name) return;
      const code = randomCode();
      socket.emit('joinRoom', { code, name });
    });

    document.getElementById('btn-join').addEventListener('click', () => {
      const name = getValidName();
      if (!name) return;
      const code = document.getElementById('code').value.trim().toUpperCase();
      if (code.length !== 6) { showError('Room code must be 6 characters.'); return; }
      socket.emit('joinRoom', { code, name });
    });

    // Allow Enter key
    ['name','code'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          const activeTab = document.querySelector('.tab.active').dataset.tab;
          document.getElementById('btn-' + activeTab).click();
        }
      });
    });

    socket.on('joined', ({ code, playerId, isHost }) => {
      sessionStorage.setItem('roomCode', code);
      sessionStorage.setItem('playerId', playerId);
      sessionStorage.setItem('playerName', document.getElementById('name').value.trim());
      sessionStorage.setItem('isHost', isHost ? '1' : '0');
      window.location.href = '/game?room=' + code;
    });

    socket.on('error', ({ msg }) => showError(msg));
  </script>
</body>
</html>
